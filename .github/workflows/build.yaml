name: Build 

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
  
      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: 3.12
  
      - name: Build
        run: |
          uv build

      - name: Upload Distributions
        uses: actions/upload-artifact@v4
        with:
          name: release-dists
          path: dist/
