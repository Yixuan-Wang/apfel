name: Build Documentation

on:
  push:
    branches:
      - main
      - dev
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: ${{ github.event_name == 'workflow_dispatch' && 0 || 1 }}

      - name: Setup PDM
        uses: pdm-project/setup-pdm@v4
        with:
          python-version: 3.12
          cache: true
          cache-dependency-path: |
            ./pdm.lock

      - name: Install dependencies
        run: |
          pdm install -dG doc

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Deploy documentation
        run: |
          git fetch origin docs:docs || echo "docs branch does not exist yet"

          if [[ $GITHUB_REF == refs/heads/main ]]; then
            pdm run mike deploy --push --update-aliases main --branch docs
          elif [[ $GITHUB_REF == refs/heads/dev ]]; then
            pdm run mike deploy --push --update-aliases dev
          elif [[ $GITHUB_REF == refs/tags/v* ]]; then
            TAG=${GITHUB_REF#refs/tags/}
            VERSION_CLEAN=${TAG#v}
            MAJOR_MINOR=$(echo $VERSION_CLEAN | cut -d. -f1,2)
            pdm run mike deploy --push --update-aliases $MAJOR_MINOR latest --branch docs
          fi