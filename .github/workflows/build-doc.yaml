name: Build Documentation

on:
  push:
    branches:
      - main
      - dev
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: ${{ github.event_name == 'workflow_dispatch' && 0 || 1 }}

      - name: Setup PDM
        uses: pdm-project/setup-pdm@v4
        with:
          python-version: 3.12
          cache: true
          cache-dependency-path: |
            ./pdm.lock

      - name: Install dependencies
        run: |
          pdm install -dG doc

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Deploy documentation
        run: |
          # Fetch gh-pages branch if it exists to ensure mike can see history/versions
          git fetch origin gh-pages:gh-pages || echo "gh-pages branch does not exist yet"

          if [[ $GITHUB_REF == refs/heads/main ]]; then
            pdm run mike deploy --push --update-aliases main
          elif [[ $GITHUB_REF == refs/heads/dev ]]; then
            pdm run mike deploy --push --update-aliases dev
          elif [[ $GITHUB_REF == refs/tags/v* ]]; then
            # Extract tag name (e.g., v1.2.3)
            TAG=${GITHUB_REF#refs/tags/}
            # Remove 'v' prefix
            VERSION_CLEAN=${TAG#v}
            # Extract Major.Minor (e.g., 1.2)
            MAJOR_MINOR=$(echo $VERSION_CLEAN | cut -d. -f1,2)
            
            # Deploy minor version and alias 'latest' to it
            pdm run mike deploy --push --update-aliases $MAJOR_MINOR latest
          fi