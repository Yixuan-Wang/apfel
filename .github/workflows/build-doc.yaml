name: Build Documentation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pull docs engine
        run: docker pull ghcr.io/yixuan-wang/astro-docs-python:latest

      - name: Build site
        run: |
          cid="$(docker create \
            -v "$PWD/docs/site:/app/docs/site:ro" \
            -v "$PWD/docs/content:/app/src/content/docs:ro" \
            -v "$PWD:/app/source:ro" \
            ghcr.io/yixuan-wang/astro-docs-python:latest)"
          trap 'docker rm -f "$cid" >/dev/null' EXIT
          docker start -a "$cid"
          mkdir out
          docker cp "$cid:/app/dist/." out/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
