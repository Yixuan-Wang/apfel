name: Build Documentation

on:
  push:
    branches:
      - main
      - dev
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: ${{ github.event_name == 'workflow_dispatch' && 0 || 1 }}

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: 3.12

      - name: Install dependencies
        run: |
          uv sync --frozen --group doc

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Deploy documentation
        run: |
          git fetch origin docs:docs || echo "docs branch does not exist yet"

          if [[ $GITHUB_REF == refs/heads/main ]]; then
            uv run mike set-default --branch docs --allow-undefined main
            uv run mike deploy --branch docs --push --update-aliases main
          elif [[ $GITHUB_REF == refs/heads/dev ]]; then
            uv run mike deploy --branch docs --push --update-aliases dev
          elif [[ $GITHUB_REF == refs/tags/v* ]]; then
            TAG=${GITHUB_REF#refs/tags/}
            VERSION_CLEAN=${TAG#v}
            MAJOR_MINOR=$(echo $VERSION_CLEAN | cut -d. -f1,2)
            uv run mike deploy --branch docs --push --update-aliases $MAJOR_MINOR latest
          fi
        